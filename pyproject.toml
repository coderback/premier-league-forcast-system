[project]
name = "plmodel"
version = "0.1.0"
description = "Premier League match-outcome and season-simulation forecaster built around a walk-forward acceptance harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Hybrid ML arms (Arm 5). Imported lazily so non-ML commands never pay the import cost.
ml = ["lightgbm>=4.3", "scikit-learn>=1.4"]

[project.scripts]
pl = "plmodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: hits the network / real corpus (deselect with -m 'not integration')",
]
