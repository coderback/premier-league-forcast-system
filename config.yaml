# Central hyperparameter config for the Premier League forecasting model.
#
# No magic numbers in code: every tunable lives here, with an inline justification. Values whose
# evidence is thin carry a `WEAK-EVIDENCE:` marker HERE and at the code site that reads them.
# See NOTES.md for the dated decision ledger behind each value.
#
# Sections are populated phase by phase. A section marked "(populated in Phase N)" is deliberately
# empty until that phase lands — an empty tunable section is honest; a placeholder value that later
# gets mistaken for a tuned one is not.

# ---------------------------------------------------------------------------------------------
# THE ACCEPTANCE RULE
#
# This is the project's single standing decision instrument. It is loaded from here and embedded
# verbatim into every harness JSON report — never re-typed in code, so a report can never claim a
# rule the config does not state.
#
# Why two gates, not one: in the WC2026 project the `rsfit` arm passed gate 1 decisively
# (-0.0011, P=0.99) while DEGRADING the market scoreboard (+0.0065 -> +0.0077). It improved the
# instrument's own distribution at the expense of the target distribution. Gate 2 exists to catch
# exactly that.
# ---------------------------------------------------------------------------------------------
acceptance_rule: |
  Accept a candidate change iff BOTH:
    (1) its paired-bootstrap RPS delta vs baseline on the test pool is favourable
        (95% CI excludes 0, OR P(better) >= 0.95), AND
    (2) its delta vs the Shin de-vigged market on the odds-covered subset does not degrade.
  An accepted variant earns a hyperparameter retune BEFORE production wiring.

# Explicit seed for every stochastic step (bootstrap resampling, Monte Carlo season sim).
# Value = the 2026/27 Premier League opening date, chosen only to be memorable and fixed.
seed: 20260822

paths:
  cache_dir: data/cache      # downloaded football-data.co.uk CSVs + parquet cache (gitignored)
  static_dir: data/static    # team alias map and other committed static inputs
  output_dir: output         # reports, fitted params, calibration plots (gitignored)

# ---------------------------------------------------------------------------------------------
# DATA
#
# Source: football-data.co.uk, free for personal/research use with attribution.
# URL pattern https://www.football-data.co.uk/mmz4281/{season}/{division}.csv
#
# Verified against the live source on 2026-08-16 (see NOTES.md entry #1 for the full survey):
#   - E0 spans 1993/94 -> 2025/26 (33 seasons); E1-E3 available for the same span.
#   - Row counts: E0 462 for 1993/94 and 1994/95 (22-team league), 380 thereafter; E1-E3 552.
#   - Encoding is utf-8 (sometimes with BOM) EXCEPT 2004/05, which is cp1252.
#   - Dates are always dayfirst but mix 2-digit and 4-digit years.
#   - There is NO matchweek/round column; the calendar structure is derived (data/fixtures.py).
#   - A `Time` column exists only from 2019/20, so the walk-forward barrier is date-granular.
#   - The source SUBSTITUTES another division's file for a season it has not published yet, with
#     a valid CSV and a non-error status. Guarded in data/football_data.py; see NOTES.md.
#
# The walk-forward barrier is one distinct match date (a "matchday"), which needs no tunable:
# E0 averages ~106 match dates per season, so per-date barriers are exact and affordable. An
# earlier date-gap grouping rule was measured and discarded — it chained transitively and merged
# whole months. The per-team round index ("matchweek") is retained for REPORTING only.
# ---------------------------------------------------------------------------------------------
data:
  base_url: https://www.football-data.co.uk/mmz4281
  divisions: [E0, E1, E2, E3]
  first_season: "9394"       # earliest season directory the source publishes for these divisions
  # Row-count floors for the ingest smoke test: the minimum matches a completed season file must
  # carry, per division. Set from the verified corpus (2026-08-16): a 20-team league plays 380,
  # a 24-team league 552. Floors rather than exact counts because the lower tiers had smaller
  # fields in the 1990s (E2 falls to 400, E3 to 440), and the in-progress season is exempt.
  min_expected_rows:
    E0: 380
    E1: 552
    E2: 400
    E3: 440

# ---------------------------------------------------------------------------------------------
# ODDS AND DE-VIG
#
# Column availability differs by era (verified 2026-08-16 against the live source, E0 counts):
#   AvgCH/AvgCD/AvgCA  2019/20 ->            market-average CLOSING; 2,660 matches, still live
#   PSCH/PSCD/PSCA     2012/13 -> 2026-01-08 Pinnacle CLOSING; 5,150 matches, then stops dead
#   BbAvH/BbAvD/BbAvA  2005/06 -> 2018/19    Betbrain average, PRE-CLOSE not closing
# The column names themselves live in data/odds.py (a property of the source); only decisions here.
# ---------------------------------------------------------------------------------------------
odds:
  # Shin (1993) is primary: Strumbelj (2016, IJF 32(2):462-472) finds Shin probabilities lowest-RPS
  # across 412 bookmaker/competition pairs, and Koning & Zijm (2023) find them unbiased for the EPL
  # specifically. The theoretical case is contested (Whelan calls it "relatively weak"), which is
  # why proportional is kept as a sensitivity rather than dropped. BOTH appear in every report.
  devig_primary: shin
  devig_sensitivity: proportional

  # The acceptance rule's gate 2 is scored against this family. Chosen over the sharper Pinnacle
  # closing line because Pinnacle's feed stops after 2026-01-08: a benchmark that dies mid-season
  # cannot judge a model that has to score the 2026/27 season. Gate 1 keeps the full decade; the
  # rule scopes gate 2 to "the odds-covered subset", so the two pools differ by design.
  gate_benchmark: avg_closing

  # Reported alongside the gate, never as it. Pinnacle reaches back to 2012/13 (3,630 of the 3,800
  # test-decade matches vs avg_closing's 2,660) and is the sharper line, so a disagreement between
  # the two is worth seeing rather than hiding.
  diagnostic_benchmarks: [pinnacle_closing]

  # De-vigged probabilities must sum to 1. Tight because the de-vig is exact arithmetic followed by
  # an explicit renormalisation, not an approximation — anything above float noise is a bug.
  sum_tolerance: 1.0e-9

# ---------------------------------------------------------------------------------------------
# MODEL
#
# Production baseline: per-team Dixon-Coles.
#   log lam_home = c + h + A[home] - D[away]
#   log mu_away  = c     + A[away] - D[home]
# with sum-to-zero attack A and defensive solidity D imposed by construction, a fitted global home
# advantage h, and the tau low-score correction rho. Weighted MLE, exponential time decay.
# ---------------------------------------------------------------------------------------------
model:
  # Scoreline grid truncation. P(a side scores >12) is ~1e-9 at football rates, and the grid is
  # renormalised after the tau correction, so this is inert well below its value.
  max_goals: 12

  # Exponential decay half-life in days. SELECTED by the grid on backtest.tuning_span
  # (1996-97..2005-06), a window neither evaluation span touches. Deliberately NOT inherited: the
  # WC2026 project's 1825 days was fitted to international football, where squads turn over far
  # more slowly than club squads do.
  #
  # Read this value as "somewhere in 240-1095", not as a precise optimum. The curve is almost flat
  # across that range on BOTH the tuning window (0.20048 at 730 vs 0.20061 at 548 — a margin of
  # 0.00013) and the independent sensitivity window (0.19651 at 548 vs 0.19671 at 730). 730 is the
  # tuning window's winner and is taken for that reason alone; the sensitivity window confirms the
  # region without being consulted for the choice. Short half-lives are genuinely bad — 30 days
  # scores 0.2237 and 0.2411 — so the flatness is a real plateau, not an absence of signal.
  # See NOTES.md for both full grids.
  decay_half_life_days: 730

  # A team needs this share of the MEDIAN team's effective (decay-weighted) history before its own
  # attack and defence are identified; below it the team is pinned at league average and reported
  # by name. Relative rather than absolute because an absolute bar does not survive a half-life
  # sweep: at a 30-day half-life a regular team accumulates only ~4.6 effective matches in total,
  # so a fixed bar of 5 would pin the entire league and score that grid point badly for a reason
  # unrelated to the model. See NOTES.md.
  # WEAK-EVIDENCE: not tuned. 15% of a normal league member's history is a wide margin for
  # "this club is effectively new here".
  min_effective_share: 0.15

  # L-BFGS-B iteration cap. Real fits converge in 30-40 iterations from a warm start; this exists
  # only so a pathological grid point cannot stall a walk.
  max_iter: 500

  param_bounds:
    intercept: [-2.0, 2.0]        # base log goal rate; exp(2) = 7.4 goals is far outside football
    home_advantage: [-1.0, 1.0]   # signed: an empty-stadium regime may genuinely push it negative
    # rho must keep every tau cell positive, but the binding constraint 1 - lam*mu*rho > 0 is
    # RATE-DEPENDENT, so no fixed bound can guarantee it: at lam = mu = 2.5 it already fails above
    # rho = 0.16. This is an outer box that keeps the optimiser sensible at rates football
    # produces; the guarantee is enforced at runtime, where an invalid rho makes the likelihood
    # return an invalid value (steering the optimiser away) and the scoreline raise. Fitted rho in
    # club football is small and negative — measured at about -0.045 here — so the positive edge
    # is far from binding in practice.
    rho: [-0.2, 0.2]
    strength: [-3.0, 3.0]         # log attack / defence; exp(3) = 20x the league average
    # Slope on the scaled Elo difference, for the elo-dc comparison arm only. A 400-point lead is
    # d = 1, so a slope of 2 would already mean exp(2) = 7x the goal rate — generous.
    elo_slope: [0.0, 2.0]
    # Structural home-advantage terms (model.seams.home_advantage). Both enter the home rate only.
    # ha_trend is per YEAR before the barrier: home advantage fell ~0.094 in log-goal units over
    # the last decade, so ~0.01/year, and 0.2 is a wide outer box around that.
    ha_trend: [-0.2, 0.2]
    # ha_empty is the whole crowd effect in log-goal units. The 2020-21 collapse is about
    # -0.10 on the home:away goal ratio, so 1.0 is generous in both directions.
    ha_empty: [-1.0, 1.0]
    # Outer box on a score-driven team state (model.seams.dynamics), in log-goal units of
    # deviation from the team's fitted level. exp(1.5) = 4.5x the team's own long-run rate, which
    # no run of form produces; this is a divergence guard for a recursion that could in principle
    # run away, not a lever, and every clip it makes is counted into the report.
    gas_state: [-1.5, 1.5]

  seams:
    covariates: []                      # extra additive strength terms
    # Score-driven (GAS) time-varying team states — see model/dynamics.py for the recursion.
    # Each team carries a deviation from its fitted attack/defence level, updated after every match
    # by the score of the conditional likelihood (goals minus expected goals, scaled).
    dynamics:
      enabled: false
      # All four SELECTED on backtest.tuning_span (1996-97..2005-06), a window neither evaluation
      # span touches. RETUNED after the arm was accepted, as the acceptance rule requires, by
      # coordinate cycles run to convergence rather than the single shallow pass that produced the
      # first values. Two cycles; every axis interior. See NOTES.md for both traces.
      #
      # score_loading K: how far one unit of relative surprise moves a state, in log-goal units.
      # Weakly identified between 0.025 and 0.03 (0.19780 against 0.19781), so read it as "about
      # 0.025". Interior: 0.015 and 0.04 are both clearly worse.
      score_loading: 0.025
      # persistence B: retained fraction of a state at a team's NEXT MATCH, not next day. The
      # clock is team-match time (the Elo convention), so this is a memory of about 140 matches —
      # more than three seasons. Worth reading twice: the tuned recursion is a slow drift in
      # strength, NOT a hot-streak detector, and the retune made it slower still. Interior: 1.0
      # (a pure random walk) is worse, so the mean reversion is doing real work.
      persistence: 0.995
      # scaling_exponent e: the score is divided by lam**e, so the update is K*(goals - lam)/lam**e.
      # 0 = unit scaling, 0.5 = inverse square-root information, 1 = inverse information.
      #
      # The first grid was {0, 0.5, 1} — the range the Creal-Koopman-Lucas family is conventionally
      # WRITTEN in — and 1.0 won at its edge. Widened, 1.5 wins outright and 2.0 is worse, so this
      # is a genuine interior optimum the conventional grid could not see. Over-scaling means a
      # goal of surprise in a low-scoring fixture moves the state further than the same surprise in
      # a high-scoring one, beyond what inverse-information already implies.
      scaling_exponent: 1.5
      # This arm's own likelihood decay. Decay and dynamics are SUBSTITUTES for tracking time
      # variation, so inheriting model.decay_half_life_days would make the comparison a test of
      # whose hyperparameter happened to suit whom, exactly as it would have for elo-dc.
      #
      # Read this as "long, and barely identified above 2555" rather than as 7300 exactly: the
      # tuning curve reads 0.19781 at 2555, 0.19780 at 5475, 0.19780 at 7300 and 0.19801 at no
      # decay at all. 7300 is the grid winner and is taken for that reason alone. Interior.
      #
      # The contrast that makes this more than a number: at 7300 days the STATIC model scores
      # 0.20264 against its own 0.20048 at 730 — a longer memory HURTS it, and by more the longer
      # it gets. The same memory helps the dynamic one. The states are what make old data usable.
      half_life_days: 7300
    # Second observation channel, log-pooled with goals. `channels: [goals]` is off.
    observation:
      channels: [goals]
      # Resolved out-of-sample matches required before the pool weight is fitted at all; below
      # this the weight is pinned at zero and the arm IS the goals baseline. One full season, so
      # the weight is never chosen from a handful of matches.
      min_pool_history: 380
      # Grid density for the weight search. The weight is bounded in [0, 1] and the log-loss
      # surface is smooth, so 101 points resolves it to 0.01 — finer than the question needs.
      pool_weight_grid: 101
    ensemble: {enabled: false}          # blend with an ML goals regressor
    # global | trend | empty | trend+empty. See model/home_advantage.py.
    # The empty-stadium window is CAUSAL — every match played without a crowd — not fitted to
    # where the effect appears. The 2020 restart (2020-06-17 onward) shows no loss of home
    # advantage at all while 2020-21 collapses, and excluding the restart on those grounds would
    # be fitting the definition to the outcome.
    home_advantage:
      mode: global
      empty_start: "2020-06-17"    # Project Restart: first match back behind closed doors
      empty_end: "2021-05-23"      # final day of 2020-21
    tiers: [E0]                         # divisions in the joint fit

# ---------------------------------------------------------------------------------------------
# BACKTEST
#
# Rolling-origin walk-forward: one barrier per distinct match date. Gate 1 and gate 2 deliberately
# use DIFFERENT pools — the acceptance rule scopes gate 2 to "the odds-covered subset", so gate 1
# keeps full-decade statistical power while gate 2 uses the only live closing-market benchmark:
#   gate 1 (vs baseline): 2016-17..2025-26, 3,800 matches over 1,153 barriers
#   gate 2 (vs market):   the avg_closing-covered subset, 2019/20+, 2,660 matches
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# ELO — the single-strength-scalar alternative, used by the elo-dc comparison arm only.
#
# The production model does NOT use these. They exist so "per-team attack/defence versus one
# rating scalar" can be measured rather than assumed — the WC2026 project chose the scalar because
# international football is too sparse for 2N parameters, a constraint a 38-round league does not
# have. The research report notes no clean published head-to-head isolates the two on league data.
#
# K and the half-life were tuned together on backtest.tuning_span so the comparison is between two
# tuned models rather than a tuned one and a default one. See NOTES.md.
# ---------------------------------------------------------------------------------------------
elo:
  initial_rating: 1500.0     # conventional Elo origin; only differences matter
  # TUNED on the tuning span by one shallow coordinate pass. Interior to its grid (10..60), and a
  # shallow optimum: 0.19760 at 15 against 0.19766 at 20.
  k: 15.0
  # Home advantage in rating points, applied to the expectation so a home win counts for less.
  # WEAK-EVIDENCE: not tuned. ~65 points is the conventional club-football value and corresponds
  # to roughly the 59% home expectation the league showed over the fitting era.
  home_advantage: 65.0
  # Goal-difference multiplier (World Football Elo): 1 for a one-goal margin, 1.5 for two, and
  # (11 + |gd|) / 8 beyond. Without it a 5-0 and a 1-0 move the ratings identically.
  gd_two_goal: 1.5
  gd_slope_offset: 11.0
  gd_slope_divisor: 8.0
  # Decay half-life for the elo-dc likelihood, tuned separately from the production model's —
  # different strength parameterisations genuinely prefer different memory, and reusing one number
  # would handicap this arm and make the comparison a test of tuning effort.
  #
  # This arm wants NO time decay. The sweep is monotone decreasing across the standard grid, hit
  # the 1825 edge, and stayed monotone when extended: 0.19760 at 1825 falling to 0.19748 at
  # effectively-uniform weights. The reason is structural rather than a search failure — the Elo
  # replay already carries the recency weighting, so the layer above it only calibrates how a
  # rating difference maps to goal rates, and that relationship is stable enough over time to want
  # every match equally. 36500 days is far longer than the corpus, so weights are uniform in
  # practice. The whole effect is worth 0.00012 RPS, so this is a fairness choice, not a lever.
  decay_half_life_days: 36500

  # Extension seams. Every one is OFF here and has a regression test asserting byte-identical
  # output when off, so turning one on is a deliberate act with a measurable effect.
backtest:
  # The division forecasts are scored on. Lower tiers are ingested for the multi-tier arm's
  # training data, never scored themselves.
  prediction_division: E0

  # Held-out span. A decade of Premier League football, training from the corpus start (1993/94)
  # so the earliest barrier still sees 23 seasons of history.
  test_span:
    first_season: "2016-17"
    last_season: "2025-26"

  # Sensitivity check on an earlier decade, to show a result is not an artefact of one era.
  sensitivity_span:
    first_season: "2006-07"
    last_season: "2015-16"

  # Hyperparameter searches run HERE and nowhere else. A third, older window so that neither the
  # test span nor the sensitivity span is ever optimised against — the WC2026 project's standing
  # lesson was "never tune against your acceptance instrument", and a sensitivity check that has
  # been tuned on is not a sensitivity check either. Opens in 1996-97 to leave three seasons of
  # training history behind the first barrier.
  tuning_span:
    first_season: "1996-97"
    last_season: "2005-06"

  # Half-life grid, in days. Published club-football optima cluster near xi = 0.0018-0.0033 per
  # day, i.e. half-lives of roughly 210-385 days. The grid is set deliberately WIDER on both sides
  # so the data can choose rather than be steered, and so a winner sitting at an edge is visible
  # as the red flag it is.
  half_life_grid_days: [30, 60, 90, 120, 180, 240, 365, 548, 730, 1095, 1460, 1825]

  # Refit cadence in barriers. 1 = refit at every matchday, which is the honest default; larger
  # values reuse the most recent fit and stay leak-free (a stale fit saw strictly less data).
  # Exists so "does refitting this often actually matter?" is measurable rather than assumed —
  # the WC2026 project's live-update channel was null three separate times.
  refit_every: 1

  # A barrier with less history than this is skipped rather than fitted on almost nothing.
  # 3,800 is ten full seasons; the test span opens with 23 seasons behind it, so this only bites
  # if someone points the splitter at the start of the corpus.
  min_train_matches: 3800

  # Paired-bootstrap resamples for model-vs-model and model-vs-market RPS deltas. 10,000 matches
  # the WC2026 value so the two projects' CIs are computed the same way.
  n_boot: 10000

  # Benjamini-Hochberg false-discovery rate across the family of arms tested. Required by the
  # metrics helper rather than defaulted, because the rate the project tolerates is a decision.
  fdr_alpha: 0.05

# ---------------------------------------------------------------------------------------------
# AUDIT — the calibration slices
#
# Slices are diagnostics, never gates. A model well calibrated overall and badly calibrated on
# promoted teams is not failing the acceptance rule; it is showing where its next improvement is.
# ---------------------------------------------------------------------------------------------
audit:
  # Reliability-diagram bins. Ten gives ~380 matches per bin on the test decade — enough for a
  # stable observed frequency, few enough that an empty bin means something.
  # WEAK-EVIDENCE: conventional choice, not tuned. The Murphy decomposition is mildly sensitive to
  # it, which is why the report carries both the direct Brier score and the decomposed one.
  calibration_bins: 10

  # The persistent-strength partition. A judgment call, so it lives here rather than in code: this
  # is the conventional "big six" of the Premier League era, the clubs with sustained title and
  # European qualification. Spellings are the corpus's own (see data/static/team_roster.yaml).
  big_six:
    - Arsenal
    - Chelsea
    - Liverpool
    - Man City
    - Man United
    - Tottenham

# ---------------------------------------------------------------------------------------------
# SEASON SIMULATION (populated with the season simulator)
#
# Team strengths are drawn from the posterior ONCE PER SEASON REPLICATE, never per match:
# per-match resampling collapses the points spread and produces overconfident title probabilities.
# ---------------------------------------------------------------------------------------------
season: {}
