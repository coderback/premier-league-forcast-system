# Central hyperparameter config for the Premier League forecasting model.
#
# No magic numbers in code: every tunable lives here, with an inline justification. Values whose
# evidence is thin carry a `WEAK-EVIDENCE:` marker HERE and at the code site that reads them.
# See NOTES.md for the dated decision ledger behind each value.
#
# A section is added when the work that needs it lands, and stays empty until then — an empty
# tunable section is honest; a placeholder value that later gets mistaken for a tuned one is not.
# Every section this file declares is now populated.

# ---------------------------------------------------------------------------------------------
# THE ACCEPTANCE RULE
#
# This is the project's single standing decision instrument. It is loaded from here and embedded
# verbatim into every harness JSON report — never re-typed in code, so a report can never claim a
# rule the config does not state.
#
# Why gate 2: in the WC2026 project the `rsfit` arm passed gate 1 decisively (-0.0011, P=0.99)
# while DEGRADING the market scoreboard (+0.0065 -> +0.0077). It improved the instrument's own
# distribution at the expense of the target distribution.
#
# Why gates 3 and 4, added 2026-08-21: this project's own `dc-copula` passed the two-gate rule and
# should not have. It bought one ten-thousandth of an RPS point, Benjamini-Hochberg rejected 0 of
# its family of 3, and the earlier decade showed exactly zero at P=0.488 -- a coin flip. The rule
# REPORTED both of those facts and acted on neither, because neither was a gate.
#
# Gate 3 makes the multiplicity correction binding rather than decorative. Three arms were
# pre-registered as a family precisely so the best of three could not be read as if it had been
# the only one, and then the rule read it that way anyway.
#
# Gate 4 is deliberately WEAK -- it asks the earlier decade only to lean the same way, not to
# reach significance. The two evaluation spans are different eras and a real effect can be
# genuinely smaller on one; demanding significance twice would reject findings that are true.
# What it catches is the arm that is *nothing* on the span it was not selected against, which is
# what `dc-copula` was.
#
# Both gates are PROSPECTIVE. They were written after `dc-copula` exposed the hole and they do not
# reverse any decision already taken; `dc-copula` was rejected on the evidence, by judgement, and
# this rule now encodes that judgement so the next one does not need it. Tested against the whole
# arm record before adoption -- see NOTES.md, which records that gate 3 would also have failed the
# retuned `dc-gas` configuration, and that this is a finding rather than an inconvenience.
# ---------------------------------------------------------------------------------------------
acceptance_rule: |
  Accept a candidate change iff ALL FOUR:
    (1) its paired-bootstrap RPS delta vs baseline on the TEST pool is favourable
        (95% CI excludes 0, OR P(better) >= 0.95), AND
    (2) its delta vs the Shin de-vigged market on the odds-covered subset does not degrade
        (where the market covers no match, this gate is NOT EVALUABLE, which is not a pass
        and not a failure), AND
    (3) it survives Benjamini-Hochberg across its own pre-registered family of arms, at
        backtest.fdr_alpha, on the Diebold-Mariano p-values, AND
    (4) the SENSITIVITY span does not contradict it: P(better) there >= 0.5.
        A single-span run therefore cannot accept anything.
  An accepted variant earns a hyperparameter retune BEFORE production wiring.

# Explicit seed for every stochastic step (bootstrap resampling, Monte Carlo season sim).
# Value = the 2026/27 Premier League opening date, chosen only to be memorable and fixed.
seed: 20260822

paths:
  cache_dir: data/cache      # downloaded football-data.co.uk CSVs + parquet cache (gitignored)
  static_dir: data/static    # team alias map and other committed static inputs
  output_dir: output         # reports, fitted params, calibration plots (gitignored)

# ---------------------------------------------------------------------------------------------
# DATA
#
# Source: football-data.co.uk, free for personal/research use with attribution.
# URL pattern https://www.football-data.co.uk/mmz4281/{season}/{division}.csv
#
# Verified against the live source on 2026-08-16 (see NOTES.md entry #1 for the full survey):
#   - E0 spans 1993/94 -> 2025/26 (33 seasons); E1-E3 available for the same span.
#   - Row counts: E0 462 for 1993/94 and 1994/95 (22-team league), 380 thereafter; E1-E3 552.
#   - Encoding is utf-8 (sometimes with BOM) EXCEPT 2004/05, which is cp1252.
#   - Dates are always dayfirst but mix 2-digit and 4-digit years.
#   - There is NO matchweek/round column; the calendar structure is derived (data/fixtures.py).
#   - A `Time` column exists only from 2019/20, so the walk-forward barrier is date-granular.
#   - The source SUBSTITUTES another division's file for a season it has not published yet, with
#     a valid CSV and a non-error status. Guarded in data/football_data.py; see NOTES.md.
#
# The walk-forward barrier is one distinct match date (a "matchday"), which needs no tunable:
# E0 averages ~106 match dates per season, so per-date barriers are exact and affordable. An
# earlier date-gap grouping rule was measured and discarded — it chained transitively and merged
# whole months. The per-team round index ("matchweek") is retained for REPORTING only.
# ---------------------------------------------------------------------------------------------
data:
  base_url: https://www.football-data.co.uk/mmz4281
  divisions: [E0, E1, E2, E3]
  first_season: "9394"       # earliest season directory the source publishes for these divisions
  # Row-count floors for the ingest smoke test: the minimum matches a completed season file must
  # carry, per division. Set from the verified corpus (2026-08-16): a 20-team league plays 380,
  # a 24-team league 552. Floors rather than exact counts because the lower tiers had smaller
  # fields in the 1990s (E2 falls to 400, E3 to 440), and the in-progress season is exempt.
  min_expected_rows:
    E0: 380
    E1: 552
    E2: 400
    E3: 440

# ---------------------------------------------------------------------------------------------
# ODDS AND DE-VIG
#
# Column availability differs by era (verified 2026-08-16 against the live source, E0 counts):
#   AvgCH/AvgCD/AvgCA  2019/20 ->            market-average CLOSING; 2,660 matches, still live
#   PSCH/PSCD/PSCA     2012/13 -> 2026-01-08 Pinnacle CLOSING; 5,150 matches, then stops dead
#   BbAvH/BbAvD/BbAvA  2005/06 -> 2018/19    Betbrain average, PRE-CLOSE not closing
# The column names themselves live in data/odds.py (a property of the source); only decisions here.
# ---------------------------------------------------------------------------------------------
odds:
  # Shin (1993) is primary: Strumbelj (2016, IJF 32(2):462-472) finds Shin probabilities lowest-RPS
  # across 412 bookmaker/competition pairs, and Koning & Zijm (2023) find them unbiased for the EPL
  # specifically. The theoretical case is contested (Whelan calls it "relatively weak"), which is
  # why proportional is kept as a sensitivity rather than dropped. BOTH appear in every report.
  devig_primary: shin
  devig_sensitivity: proportional

  # The acceptance rule's gate 2 is scored against this family. Chosen over the sharper Pinnacle
  # closing line because Pinnacle's feed stops after 2026-01-08: a benchmark that dies mid-season
  # cannot judge a model that has to score the 2026/27 season. Gate 1 keeps the full decade; the
  # rule scopes gate 2 to "the odds-covered subset", so the two pools differ by design.
  gate_benchmark: avg_closing

  # Reported alongside the gate, never as it. Pinnacle reaches back to 2012/13 (3,630 of the 3,800
  # test-decade matches vs avg_closing's 2,660) and is the sharper line, so a disagreement between
  # the two is worth seeing rather than hiding.
  diagnostic_benchmarks: [pinnacle_closing]

  # De-vigged probabilities must sum to 1. Tight because the de-vig is exact arithmetic followed by
  # an explicit renormalisation, not an approximation — anything above float noise is a bug.
  sum_tolerance: 1.0e-9

# ---------------------------------------------------------------------------------------------
# MODEL
#
# Production baseline: per-team Dixon-Coles.
#   log lam_home = c + h + A[home] - D[away]
#   log mu_away  = c     + A[away] - D[home]
# with sum-to-zero attack A and defensive solidity D imposed by construction, a fitted global home
# advantage h, and the tau low-score correction rho. Weighted MLE, exponential time decay.
# ---------------------------------------------------------------------------------------------
model:
  # Scoreline grid truncation. P(a side scores >12) is ~1e-9 at football rates, and the grid is
  # renormalised after the tau correction, so this is inert well below its value.
  max_goals: 12

  # Exponential decay half-life in days. SELECTED by the grid on backtest.tuning_span
  # (1996-97..2005-06), a window neither evaluation span touches. Deliberately NOT inherited: the
  # WC2026 project's 1825 days was fitted to international football, where squads turn over far
  # more slowly than club squads do.
  #
  # Read this value as "somewhere in 240-1095", not as a precise optimum. The curve is almost flat
  # across that range on BOTH the tuning window (0.20048 at 730 vs 0.20061 at 548 — a margin of
  # 0.00013) and the independent sensitivity window (0.19651 at 548 vs 0.19671 at 730). 730 is the
  # tuning window's winner and is taken for that reason alone; the sensitivity window confirms the
  # region without being consulted for the choice. Short half-lives are genuinely bad — 30 days
  # scores 0.2237 and 0.2411 — so the flatness is a real plateau, not an absence of signal.
  # See NOTES.md for both full grids.
  decay_half_life_days: 730

  # A team needs this share of the MEDIAN team's effective (decay-weighted) history before its own
  # attack and defence are identified; below it the team is pinned at league average and reported
  # by name. Relative rather than absolute because an absolute bar does not survive a half-life
  # sweep: at a 30-day half-life a regular team accumulates only ~4.6 effective matches in total,
  # so a fixed bar of 5 would pin the entire league and score that grid point badly for a reason
  # unrelated to the model. See NOTES.md.
  # WEAK-EVIDENCE: not tuned. 15% of a normal league member's history is a wide margin for
  # "this club is effectively new here".
  min_effective_share: 0.15

  # L-BFGS-B iteration cap. Real fits converge in 30-40 iterations from a warm start; this exists
  # only so a pathological grid point cannot stall a walk.
  max_iter: 500

  param_bounds:
    intercept: [-2.0, 2.0]        # base log goal rate; exp(2) = 7.4 goals is far outside football
    home_advantage: [-1.0, 1.0]   # signed: an empty-stadium regime may genuinely push it negative
    # rho must keep every tau cell positive, but the binding constraint 1 - lam*mu*rho > 0 is
    # RATE-DEPENDENT, so no fixed bound can guarantee it: at lam = mu = 2.5 it already fails above
    # rho = 0.16. This is an outer box that keeps the optimiser sensible at rates football
    # produces; the guarantee is enforced at runtime, where an invalid rho makes the likelihood
    # return an invalid value (steering the optimiser away) and the scoreline raise. Fitted rho in
    # club football is small and negative — measured at about -0.045 here — so the positive edge
    # is far from binding in practice.
    rho: [-0.2, 0.2]
    strength: [-3.0, 3.0]         # log attack / defence; exp(3) = 20x the league average
    # Slope on the scaled Elo difference, for the elo-dc comparison arm only. A 400-point lead is
    # d = 1, so a slope of 2 would already mean exp(2) = 7x the goal rate — generous.
    elo_slope: [0.0, 2.0]
    # Structural home-advantage terms (model.seams.home_advantage). Both enter the home rate only.
    # ha_trend is per YEAR before the barrier: home advantage fell ~0.094 in log-goal units over
    # the last decade, so ~0.01/year, and 0.2 is a wide outer box around that.
    ha_trend: [-0.2, 0.2]
    # ha_empty is the whole crowd effect in log-goal units. The 2020-21 collapse is about
    # -0.10 on the home:away goal ratio, so 1.0 is generous in both directions.
    ha_empty: [-1.0, 1.0]
    # Alternative scoreline family (model.seams.scoreline). weibull_log_shape is log(c), so 0 IS
    # the Poisson and the seam's inertness point sits at the centre of its own box rather than on
    # an edge. The box spans c in [0.61, 1.65]: the published football estimate is near 1.1 and
    # this corpus's own count distribution says 1.00, so both live far inside it, and a fit that
    # reached either end would be reporting a shape no goal process plausibly has.
    weibull_log_shape: [-0.5, 0.5]
    # Frank copula dependence. k -> 0 is independence and the sign is the direction of dependence.
    # A Kendall tau of 0.03 -- roughly the residual correlation measured in this corpus -- is
    # k = 0.27, so 5 is nearly twenty times any dependence football has shown and is an outer box
    # rather than a constraint.
    frank_kappa: [-5.0, 5.0]
    # Match-context covariates (model.seams.covariates). Each enters BOTH rates -- the home side's
    # value adds to the home rate and subtracts from the away rate -- so a box is a statement about
    # how far one unit of context can move a scoreline.
    #
    # cov_rest is per DAY of rest differential. At the top of this box a one-week differential
    # would be exp(0.05*7) = 1.42x the goal rate, which no fatigue study has ever suggested, so
    # this is an outer box rather than a constraint.
    cov_rest: [-0.05, 0.05]
    # cov_congestion is per MATCH already played in the trailing window. The differential spans
    # about +/-3 matches, and exp(0.3) = 1.35x per extra match is generous in both directions.
    cov_congestion: [-0.3, 0.3]
    # cov_euro is the WHOLE effect of a European commitment, the flag being 0 or 1. exp(0.5) =
    # 1.65x is far beyond anything a midweek fixture could plausibly do to a league match.
    cov_euro: [-0.5, 0.5]
    # Outer box on a score-driven team state (model.seams.dynamics), in log-goal units of
    # deviation from the team's fitted level. exp(1.5) = 4.5x the team's own long-run rate, which
    # no run of form produces; this is a divergence guard for a recursion that could in principle
    # run away, not a lever, and every clip it makes is counted into the report.
    gas_state: [-1.5, 1.5]

  seams:
    # Match-context terms: properties of the FIXTURE rather than of the teams. Empty is off, and
    # off means the design matrices are empty and the likelihood is byte-identical. How each term
    # is measured lives in `model.context` below, following the same split as the ensemble seam
    # and `model.gbm`: the seam says which terms are on, the settings block says what they mean.
    #
    #   rest        days since that side's previous league match, within the season
    #   congestion  league matches that side played in a trailing window
    #   euro        that club qualified for Europe this season, inside UEFA's playing weeks
    #
    # See model/covariates.py, and read its note on measurement error before reading a result:
    # rest is computed from LEAGUE matches only, because the corpus has no cup or European
    # fixtures, so European clubs look more rested than they are and the `euro` term is the only
    # place that bias has to go.
    covariates: []
    # Score-driven (GAS) time-varying team states — see model/dynamics.py for the recursion.
    # Each team carries a deviation from its fitted attack/defence level, updated after every match
    # by the score of the conditional likelihood (goals minus expected goals, scaled).
    dynamics:
      enabled: false
      # All four SELECTED on backtest.tuning_span (1996-97..2005-06), a window neither evaluation
      # span touches. RETUNED after the arm was accepted, as the acceptance rule requires, by
      # coordinate cycles run to convergence rather than the single shallow pass that produced the
      # first values. Two cycles; every axis interior. See NOTES.md for both traces.
      #
      # score_loading K: how far one unit of relative surprise moves a state, in log-goal units.
      # Weakly identified between 0.025 and 0.03 (0.19780 against 0.19781), so read it as "about
      # 0.025". Interior: 0.015 and 0.04 are both clearly worse.
      score_loading: 0.025
      # persistence B: retained fraction of a state at a team's NEXT MATCH, not next day. The
      # clock is team-match time (the Elo convention), so this is a memory of about 140 matches —
      # more than three seasons. Worth reading twice: the tuned recursion is a slow drift in
      # strength, NOT a hot-streak detector, and the retune made it slower still. Interior: 1.0
      # (a pure random walk) is worse, so the mean reversion is doing real work.
      persistence: 0.995
      # scaling_exponent e: the score is divided by lam**e, so the update is K*(goals - lam)/lam**e.
      # 0 = unit scaling, 0.5 = inverse square-root information, 1 = inverse information.
      #
      # The first grid was {0, 0.5, 1} — the range the Creal-Koopman-Lucas family is conventionally
      # WRITTEN in — and 1.0 won at its edge. Widened, 1.5 wins outright and 2.0 is worse, so this
      # is a genuine interior optimum the conventional grid could not see. Over-scaling means a
      # goal of surprise in a low-scoring fixture moves the state further than the same surprise in
      # a high-scoring one, beyond what inverse-information already implies.
      scaling_exponent: 1.5
      # This arm's own likelihood decay. Decay and dynamics are SUBSTITUTES for tracking time
      # variation, so inheriting model.decay_half_life_days would make the comparison a test of
      # whose hyperparameter happened to suit whom, exactly as it would have for elo-dc.
      #
      # The tuning curve is flat above 2555 — 0.19781 at 2555, 0.19780 at 5475, 0.19780 at 7300 —
      # so RPS alone could not choose, and 7300 shipped for a while as the bare grid winner.
      #
      # BROKEN ON A SECOND TUNING-SPAN CRITERION, 2026-08-21. With only the level's memory varied,
      # 2555 and 7300 are RPS-identical to five decimal places and 2555's home/away calibration is
      # 43% better:
      #
      #   half-life      RPS   total err   home err   away err   split gap
      #         730  0.20373      -1.51%     -1.47%     -1.57%      0.11%
      #        2555  0.20338      -1.49%     -1.36%     -1.68%      0.33%
      #        7300  0.20338      -1.47%     -1.23%     -1.81%      0.58%
      #
      # The split gap is monotone in the memory, which is what a level half-life inheriting a
      # drifting home advantage looks like. A tie needs a tie-break and any criterion measured on
      # the tuning span is protocol-legal. 730 is not a candidate: it costs 0.00035 of RPS,
      # comparable to the whole arm's effect.
      #
      # The contrast that makes this more than a number: at a long memory the STATIC model scores
      # 0.20264 against its own 0.20048 at 730 — a longer memory HURTS it, and by more the longer
      # it gets. The same memory helps the dynamic one. The states are what make old data usable.
      half_life_days: 2555
    # Second observation channel, log-pooled with goals. `channels: [goals]` is off.
    observation:
      channels: [goals]
      # Resolved out-of-sample matches required before the pool weight is fitted at all; below
      # this the weight is pinned at zero and the arm IS the goals baseline. One full season, so
      # the weight is never chosen from a handful of matches.
      min_pool_history: 380
      # Grid density for the weight search. The weight is bounded in [0, 1] and the log-loss
      # surface is smooth, so 101 points resolves it to 0.01 — finer than the question needs.
      pool_weight_grid: 101
    # Blend with a gradient-boosted per-team goals regressor (the Groll hybrid). `enabled: false`
    # is off, and off means the production model never imports lightgbm at all.
    #
    # The regressor consumes the Dixon-Coles fit's own abilities as features and produces goal
    # rates, which then go through the SAME tau correction with the SAME fitted rho. So this arm
    # varies the map from abilities to rates and nothing else -- not the information set, not the
    # memory, not the scoreline family.
    ensemble:
      enabled: false
      # Weight on the gradient-boosted parent in the logarithmic pool.
      #   fitted -> chosen online at every barrier by minimising log loss over every EARLIER
      #             barrier's already-resolved out-of-sample forecasts. Leak-free by construction.
      #   0.5    -> the fixed even split the WC2026 project shipped, kept so "is 50/50 actually
      #             optimal?" is a measurement rather than an assumption.
      blend_weight: fitted
      # Resolved out-of-sample matches required before the weight is fitted at all; below this it
      # is pinned at zero and the arm IS the goals baseline. One full season, so the weight is
      # never chosen from a handful of matches. Matches the second-channel seam's threshold.
      min_pool_history: 380
      # Grid density for the weight search, before a local polish. The weight is bounded in [0, 1]
      # and the log-loss surface is smooth, so 101 points resolves it to 0.01.
      pool_weight_grid: 101
      # The fixed even split the WC2026 project shipped. Used by the ens-gbm-half comparison arm
      # only, and present so that "is 50/50 actually optimal?" is a measurement rather than an
      # assumption inherited from a different competition.
      even_split_weight: 0.5

    # global | trend | empty | trend+empty. See model/home_advantage.py.
    # The empty-stadium window is CAUSAL — every match played without a crowd — not fitted to
    # where the effect appears. The 2020 restart (2020-06-17 onward) shows no loss of home
    # advantage at all while 2020-21 collapses, and excluding the restart on those grounds would
    # be fitting the definition to the outcome.
    home_advantage:
      mode: global
      empty_start: "2020-06-17"    # Project Restart: first match back behind closed doors
      empty_end: "2021-05-23"      # final day of 2020-21
    tiers: [E0]                         # divisions in the joint fit
    # Per-parameter time decay: a separate memory for team strength, the league level and home
    # advantage. All three equal IS the production specification, so that is the inert setting --
    # and off means the fit takes its ordinary single-weight path, not a longer route to the same
    # number. See model/decay.py for why this cannot be a weights change inside one likelihood.
    #
    #   team             attack and defence         -- expected long, team strength is stable
    #   level            intercept and rho          -- expected short, 2023-24 moved the league
    #                                                  scoring rate faster than 730 days can follow
    #   home_advantage   home advantage and its
    #                    structural design columns  -- expected short, it fell +0.2711 -> +0.1774
    #                                                  across the test decade alone
    #
    # The blocks are cycled to convergence rather than fitted jointly, because separate weights
    # per block make the objective value and its gradient inconsistent -- see the module docstring.
    decay:
      enabled: false
      # SELECTED by coordinate cycles run to convergence on backtest.tuning_span
      # (1996-97..2005-06), scored on walk-forward RPS. Converged after two cycles with every axis
      # interior. Tuning RPS 0.20043 against the single-memory 0.20048 -- a gain of 0.00005, which
      # is the size the ledger predicted before the search ran.
      #
      # READ THE HOME-ADVANTAGE VALUE WITH THE WARNING THAT FOLLOWS. The tuner asked for a LONGER
      # memory than production, not a shorter one, and it was right to on the window it was given:
      # home advantage is FLAT across the tuning span, drifting +0.3215 -> +0.3217 in seven years.
      # Where a parameter does not move, a longer memory is pure variance reduction.
      #
      # It moves later. Home advantage falls -0.0648 across the sensitivity decade and -0.0936
      # across the test decade, and its variability triples (sd 0.0117 -> 0.0269 -> 0.0403). So
      # this value is selected against a window in which the phenomenon it exists to track is
      # absent. That is a property of the tuning protocol, not a mistake in the search, and it is
      # recorded in NOTES.md as the finding it is.
      team: 730
      level: 365
      home_advantage: 1460
      # Stopping rule for the cycle. No defensible default, so both are required rather than
      # inherited: a fit that stopped because it ran out of cycles is a different object from one
      # that stopped because it converged, and both counts are reported.
      #
      # The tolerance is the largest absolute parameter move across a whole cycle, in log-goal
      # units, and 1e-4 is chosen against a MEASURED floor rather than picked for tidiness. The
      # cycle cannot converge below the inner L-BFGS-B solve's own precision, which was traced on
      # a real barrier: movement falls from 6e-1 to 4e-5 by cycle 20 and then stops improving,
      # wandering between 1e-5 and 7e-4 for another twenty cycles while the likelihood moves in the
      # ninth decimal. Asking for 1e-6 therefore guarantees hitting the cap on every single fit.
      #
      # 1e-4 is where the likelihood has visibly stopped improving, and exp(1e-4) is a
      # ten-thousandth of a goal -- far below anything that moves a forecast.
      #
      # Sanity on the whole scheme: with a tightened inner solve the cycle reaches a LOWER weighted
      # negative log-likelihood than the joint fit does (3138.526839 against 3138.526890), so the
      # blocks are solving the right problem and the residual is the joint fit's own tolerance
      # rather than an error in the cycle.
      max_cycles: 25
      tolerance: 1.0e-4
    # The scoreline family: which count law the goals follow and which device couples the two
    # sides. `poisson` + `tau` IS the Dixon-Coles specification, so that pair is the inert setting
    # and it does not merely approximate the production path -- it bypasses the family code
    # entirely, leaving the production likelihood untouched.
    #
    #   marginal:   poisson | weibull   -- weibull adds a shape parameter, fitted, where 1 is the
    #                                      Poisson, below 1 over-disperses and above 1 under-.
    #   dependence: tau | frank         -- tau adjusts four low-scoring cells; frank is a copula
    #                                      applied across the whole table, with a fitted parameter
    #                                      whose sign is the direction of dependence.
    #
    # The two axes are separate on purpose. The published model (Boshnakov, Kharrat & McHale 2017)
    # moves both at once, and this project has already paid once for reading a two-axis result as
    # if it were one -- see the score-driven arm, which had to be decomposed after the fact.
    scoreline:
      marginal: poisson
      dependence: tau
      # Terms kept in the Weibull count's alternating series. The terms behave like Poisson terms
      # rate**j / j!, so they vanish once j is past the rate; 60 is ~40 beyond anything football
      # produces, and the cost is one 61x61 matrix product per likelihood evaluation. Truncating
      # too early is the one way this family can be quietly wrong, so the series' cancellation is
      # measured at every fit and reported as `series_condition` rather than assumed away.
      n_series_terms: 60
  # LightGBM settings for the hybrid arm. TUNED on backtest.tuning_span and inherited from nowhere:
  # the WC2026 project's values were fitted to international football on a corpus a fraction of
  # this size. See NOTES.md for the trace.
  #
  # Determinism is not among the tunables. `deterministic` and a single thread are pinned in code,
  # because this project asserts byte-identical output in several places and the WC2026 project was
  # bitten by a forest predicting in nondeterministic chunk order.
  gbm:
    # SELECTED by coordinate descent cycled to convergence on the tuning span, scored on the
    # gradient-boosted parent's own walk-forward RPS. Every axis is interior; two of them
    # (num_leaves, min_data_in_leaf) first won at a grid edge and the grid was extended downward
    # until they did not, which moved num_leaves from 7 to 5 and improved 0.20125 to 0.20101.
    #
    # Read the tuned model for what it is: **five leaves and two hundred small steps is a tree
    # model asking to do as little as possible.** Capacity in either direction is punished hard --
    # 31 leaves scores 0.20458 and 800 rounds 0.20206 against the optimum's 0.20101 -- which is
    # what a model with nothing much to find looks like when it is honestly tuned.
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 5
    min_data_in_leaf: 20

  # How each match-context covariate is MEASURED. The seam above says which terms are on; this
  # says what they mean, so two arms can differ in which terms they carry and in nothing else.
  #
  # Only the two genuinely arbitrary settings are tuned, and both on backtest.tuning_span. The
  # other three are CAUSAL definitions -- what the league calendar is, what UEFA's allocation for
  # England is, when UEFA plays -- and tuning them would be fitting the definition to the outcome,
  # exactly the trap the empty-stadium window was defined to avoid.
  context:
    # diff  -> one parameter per term: a tired side scores less by as much as it concedes more.
    # split -> two, so the attack and defence halves of that restriction are free to differ.
    # The differential form is what the research report recommends and is the production default;
    # `split` exists so the restriction is a measurement rather than an assumption.
    mode: diff
    # Days of rest beyond which more rest is treated as the same amount of rest, before the two
    # sides are differenced. CAUSAL, and the one place in this project where a tuning grid was run
    # and then NOT followed -- so the reason is here rather than in the ledger alone.
    #
    # The grid on backtest.tuning_span, every value scored as the `rest` arm's own walk-forward
    # RPS against a baseline of 0.20048:
    #
    #     clip     3        4        5        7       10       14       21
    #     RPS   0.20051  0.20049  0.20050  0.20062  0.20060  0.20058  0.20057
    #     zeros   99.3%    90.2%    86.4%    68.9%    62.0%    55.6%    54.6%
    #
    # Every value is worse than the baseline, and the winner (4, interior after the grid was
    # extended down from 7) wins by leaving nine matches in ten with a rest differential of
    # exactly zero. **The standing rule this establishes: take the grid winner unless the winner
    # works by switching the term off, in which case the grid is answering the arm's question
    # rather than choosing a hyperparameter.** Handing the arm a covariate that fires on a tenth
    # of the sample and then reporting the near-null as a measurement of rest would be a way of
    # not testing it.
    #
    # 14 days is where extra days stop plausibly meaning anything -- a club two weeks without a
    # match is on a break, not rested -- and it keeps 96% of the correlation with unclipped rest
    # while capping the 2019-20 suspension's 107-day gap, which is not rest either. The choice
    # cannot change the verdict, only its size: every value on the grid rejects.
    rest_clip_days: 14
    # The value one week of rest is measured against, in days. CAUSAL, not tuned: 7 days is the
    # league's modal gap -- 30.5% of all gaps on the tuning span are exactly a week -- so a
    # centred covariate reads as "days more rested than a normal week" and the intercept keeps
    # meaning the same thing it meant before the seam existed.
    rest_reference_days: 7
    # Trailing window, in days, over which a side's already-played league matches are counted.
    # SELECTED by the grid on backtest.tuning_span; interior after BOTH edges were extended (up
    # from 28, then again from 56 to 120), scored as the `congestion` arm's own walk-forward RPS:
    #
    #     window    7       10       14       21       28       42       56       84      120
    #     RPS    0.20065  0.20059  0.20065  0.20061  0.20052  0.20053  0.20041  0.20051  0.20052
    #
    # Read this as "the curve is flat and 56 is a spike of one ten-thousandth in it", not as a
    # resolved optimum: 56 is the only value that beats the 0.20048 baseline and it does so by
    # 0.00008, with both neighbours worse. It is taken because it is the grid's winner and it is
    # interior, and unlike the rest clip it wins by making the term MORE active, not less --
    # the share of matches with a zero differential falls from 84% at a week to 61% here.
    congestion_window_days: 56
    # How many clubs from the previous season's final table are treated as being in Europe.
    # CAUSAL, not tuned: England's UEFA allocation over this corpus is four Champions League
    # places plus a Europa League place for fifth, with the remaining berths going to the cup
    # winners or to sixth. Six is the number of league positions that reliably carry a European
    # commitment; clubs that qualified through a cup the corpus cannot see are scored as not in
    # Europe, which pulls the fitted coefficient toward zero rather than away from it.
    euro_top_k: 6
    # UEFA's playing season, as (MM-DD, MM-DD) wrapping the calendar year. CAUSAL: the group
    # stages begin in mid-September and the finals are played by the end of May. Outside it the
    # term is defined to be zero, which is what makes the out-of-window coefficient a placebo
    # test rather than a second free parameter.
    euro_window: ["09-14", "05-31"]

# ---------------------------------------------------------------------------------------------
# BACKTEST
#
# Rolling-origin walk-forward: one barrier per distinct match date. Gate 1 and gate 2 deliberately
# use DIFFERENT pools — the acceptance rule scopes gate 2 to "the odds-covered subset", so gate 1
# keeps full-decade statistical power while gate 2 uses the only live closing-market benchmark:
#   gate 1 (vs baseline): 2016-17..2025-26, 3,800 matches over 1,153 barriers
#   gate 2 (vs market):   the avg_closing-covered subset, 2019/20+, 2,660 matches
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# ELO — the single-strength-scalar alternative, used by the elo-dc comparison arm only.
#
# The production model does NOT use these. They exist so "per-team attack/defence versus one
# rating scalar" can be measured rather than assumed — the WC2026 project chose the scalar because
# international football is too sparse for 2N parameters, a constraint a 38-round league does not
# have. The research report notes no clean published head-to-head isolates the two on league data.
#
# K and the half-life were tuned together on backtest.tuning_span so the comparison is between two
# tuned models rather than a tuned one and a default one. See NOTES.md.
# ---------------------------------------------------------------------------------------------
elo:
  initial_rating: 1500.0     # conventional Elo origin; only differences matter
  # TUNED on the tuning span by one shallow coordinate pass. Interior to its grid (10..60), and a
  # shallow optimum: 0.19760 at 15 against 0.19766 at 20.
  k: 15.0
  # Home advantage in rating points, applied to the expectation so a home win counts for less.
  # WEAK-EVIDENCE: not tuned. ~65 points is the conventional club-football value and corresponds
  # to roughly the 59% home expectation the league showed over the fitting era.
  home_advantage: 65.0
  # Goal-difference multiplier (World Football Elo): 1 for a one-goal margin, 1.5 for two, and
  # (11 + |gd|) / 8 beyond. Without it a 5-0 and a 1-0 move the ratings identically.
  gd_two_goal: 1.5
  gd_slope_offset: 11.0
  gd_slope_divisor: 8.0
  # Decay half-life for the elo-dc likelihood, tuned separately from the production model's —
  # different strength parameterisations genuinely prefer different memory, and reusing one number
  # would handicap this arm and make the comparison a test of tuning effort.
  #
  # This arm wants NO time decay. The sweep is monotone decreasing across the standard grid, hit
  # the 1825 edge, and stayed monotone when extended: 0.19760 at 1825 falling to 0.19748 at
  # effectively-uniform weights. The reason is structural rather than a search failure — the Elo
  # replay already carries the recency weighting, so the layer above it only calibrates how a
  # rating difference maps to goal rates, and that relationship is stable enough over time to want
  # every match equally. 36500 days is far longer than the corpus, so weights are uniform in
  # practice. The whole effect is worth 0.00012 RPS, so this is a fairness choice, not a lever.
  decay_half_life_days: 36500

  # Extension seams. Every one is OFF here and has a regression test asserting byte-identical
  # output when off, so turning one on is a deliberate act with a measurable effect.
backtest:
  # The division forecasts are scored on. Lower tiers are ingested for the multi-tier arm's
  # training data, never scored themselves.
  prediction_division: E0

  # Held-out span. A decade of Premier League football, training from the corpus start (1993/94)
  # so the earliest barrier still sees 23 seasons of history.
  test_span:
    first_season: "2016-17"
    last_season: "2025-26"

  # Sensitivity check on an earlier decade, to show a result is not an artefact of one era.
  sensitivity_span:
    first_season: "2006-07"
    last_season: "2015-16"

  # Hyperparameter searches run HERE and nowhere else. A third, older window so that neither the
  # test span nor the sensitivity span is ever optimised against — the WC2026 project's standing
  # lesson was "never tune against your acceptance instrument", and a sensitivity check that has
  # been tuned on is not a sensitivity check either. Opens in 1996-97 to leave three seasons of
  # training history behind the first barrier.
  tuning_span:
    first_season: "1996-97"
    last_season: "2005-06"

  # Half-life grid, in days. Published club-football optima cluster near xi = 0.0018-0.0033 per
  # day, i.e. half-lives of roughly 210-385 days. The grid is set deliberately WIDER on both sides
  # so the data can choose rather than be steered, and so a winner sitting at an edge is visible
  # as the red flag it is.
  half_life_grid_days: [30, 60, 90, 120, 180, 240, 365, 548, 730, 1095, 1460, 1825]

  # Refit cadence in barriers. 1 = refit at every matchday, which is the honest default; larger
  # values reuse the most recent fit and stay leak-free (a stale fit saw strictly less data).
  # Exists so "does refitting this often actually matter?" is measurable rather than assumed —
  # the WC2026 project's live-update channel was null three separate times.
  refit_every: 1

  # A barrier with less history than this is skipped rather than fitted on almost nothing.
  # 3,800 is ten full seasons; the test span opens with 23 seasons behind it, so this only bites
  # if someone points the splitter at the start of the corpus.
  min_train_matches: 3800

  # Paired-bootstrap resamples for model-vs-model and model-vs-market RPS deltas. 10,000 matches
  # the WC2026 value so the two projects' CIs are computed the same way.
  n_boot: 10000

  # Benjamini-Hochberg false-discovery rate across the family of arms tested. Required by the
  # metrics helper rather than defaulted, because the rate the project tolerates is a decision.
  fdr_alpha: 0.05

# ---------------------------------------------------------------------------------------------
# AUDIT — the calibration slices
#
# Slices are diagnostics, never gates. A model well calibrated overall and badly calibrated on
# promoted teams is not failing the acceptance rule; it is showing where its next improvement is.
# ---------------------------------------------------------------------------------------------
audit:
  # Reliability-diagram bins. Ten gives ~380 matches per bin on the test decade — enough for a
  # stable observed frequency, few enough that an empty bin means something.
  # WEAK-EVIDENCE: conventional choice, not tuned. The Murphy decomposition is mildly sensitive to
  # it, which is why the report carries both the direct Brier score and the decomposed one.
  calibration_bins: 10

  # The persistent-strength partition. A judgment call, so it lives here rather than in code: this
  # is the conventional "big six" of the Premier League era, the clubs with sustained title and
  # European qualification. Spellings are the corpus's own (see data/static/team_roster.yaml).
  big_six:
    - Arsenal
    - Chelsea
    - Liverpool
    - Man City
    - Man United
    - Tottenham

# ---------------------------------------------------------------------------------------------
# SEASON SIMULATION
#
# Team strengths are drawn ONCE PER SEASON REPLICATE, never per match: per-match resampling
# averages the perturbation away inside a single season, which collapses the points spread instead
# of widening it and produces exactly the overconfident title probabilities it was meant to fix.
# ---------------------------------------------------------------------------------------------
season:
  # Replicates for `pl simulate`. The research report puts tail stabilisation at 10,000-50,000 and
  # the WC2026 project used 50,000. Measured here on a preseason 2024-25 simulation, the
  # favourite's title probability across three seeds spans 0.6392-0.6516 at ten thousand
  # replicates and 0.6439-0.6449 at fifty thousand -- 0.012 against 0.001. A number quoted to
  # three decimals should not move in the second one, and ten seconds is not a wait.
  n_replicates: 50000

  # Replicates inside the validation sweep, which runs the simulator eighty times per span. Ten
  # thousand puts the Monte Carlo standard error at 0.005 on a probability near a half, which adds
  # about 2.5e-5 to every Brier score.
  #
  # That sounds fatal beside the 5e-4 differences the sweep resolves, and is not, because the
  # offset is the same for both settings and cancels in the paired difference. What the replicate
  # count actually costs is interval width, not the estimate -- the bootstrap sees the extra
  # variance and reports it. Raising this to fifty thousand would narrow the intervals and
  # quintuple a sweep that already takes five minutes a span.
  validation_replicates: 10000

  # Replicates held in memory at once. The inner arrays are (chunk x fixtures), so 2,000 keeps the
  # working set near 6 MB per array on a 380-fixture season while amortising the per-chunk numpy
  # overhead.
  #
  # It is a memory setting, and it is NOT inert: the replicates are drawn from one generator in
  # chunk-sized blocks, so changing this changes which random numbers land where and therefore the
  # Monte Carlo noise on every probability. It does not change the distribution being sampled,
  # which is what tests/test_season_simulate.py pins — two chunk sizes agree to within the
  # replicate count's own standard error, and a fixed chunk size with a fixed seed is exactly
  # reproducible. Do not read a difference between two runs at different chunk sizes as a finding.
  chunk_size: 2000

  # Ten fixtures make a Premier League matchweek. A property of a 20-club round robin, not a
  # tunable -- but it is what converts "three matchweeks in" into a fixture index, so it is read
  # from here rather than written into the code.
  fixtures_per_week: 10

  # Where inside a season the validation sweep places its barriers: before a ball is kicked, and
  # then at roughly a quarter, a half and three quarters of the way through. Preseason is the
  # headline because it is the hardest and the one everybody publishes; the other three exist to
  # show how the calibration moves as the horizon shortens, which is the only way to tell a
  # mis-scaled uncertainty from a mis-specified model.
  validation_weeks: [0, 9, 19, 28]

  # Floor applied to a probability before taking its log. A 10,000-replicate simulation cannot
  # resolve a probability below 1e-4, so anything smaller is the replicate count talking rather
  # than the model; the floor makes that explicit and the report states what share of rows it
  # touched. Brier, which needs no floor, is the headline for exactly this reason.
  prob_floor: 1.0e-4

  # The positional questions the simulator answers. Positional on purpose: which finish earns the
  # title, relegation or a European place is a season-specific rule this corpus does not carry.
  # England had three Champions League places before 2002-03 and five in 2023-24 and 2024-25, and
  # 1994-95 relegated four clubs to shrink the division from 22 to 20. "top 4" is a position, and
  # calling it qualification would be a claim about a different season each time.
  questions:
    title: [top, 1]
    top_four: [top, 4]
    relegation: [bottom, 3]

  # How parameter uncertainty is propagated: `point` freezes the fitted strengths, `drift` draws a
  # per-replicate perturbation of them.
  #
  # `drift`, and the reasoning is worth having here rather than only in the ledger. The criterion
  # was declared before either evaluation span was read: a calibrated points forecast puts 0.20 of
  # its PIT mass in the outer tenths. Measured:
  #
  #                       tuning 1996-2006   sensitivity 2006-16   test 2016-26
  #   point                     0.274               0.281             0.341
  #   drift                     0.206               0.211             0.263
  #
  # All three windows agree, and the point estimate is too narrow on all three. What `drift` does
  # NOT do is clear the acceptance rule's bar on the three binary questions: the Brier delta is
  # -0.0005 on the test span and -0.0008 on the sensitivity span, with P(better) 0.815 and 0.844.
  # Ten season-years cannot resolve a difference that size and were never going to.
  #
  # Read the choice as specifying a new command rather than as passing a gate. A season simulator
  # whose stated 90% points band contains the truth two times in three is wrong about the thing it
  # is for, and that is measured rather than argued. Anyone who disagrees can set this to `point`
  # or pass `--uncertainty point`, and the numbers above are what they would be choosing.
  uncertainty: drift

  drift:
    # Standard deviation, in log-goals, of a club's strength movement over a WHOLE season; the
    # scale actually applied is sd * horizon**exponent.
    #
    # Attack and defence carry the same number because they were measured to move by the same
    # amount: across 7,458 club-barrier pairs on the tuning span the ratio sd(defence)/sd(attack)
    # is 1.058, and the per-matchweek ratios straddle 1 with no trend.
    #
    # The LEVEL is not that measurement. Comparing the fit at a barrier with the fit at the season
    # end gives 0.083 over a full season, but those two fits share almost all of their data under
    # a 730-day half-life, so that number is an attenuated view of the movement that matters and
    # is a floor rather than an estimate. The value below is calibrated on the tuning span against
    # the probability integral transform of actual final points, over the grid
    # [0, 0.03, 0.06, 0.09, 0.12, 0.15, 0.20, 0.25, 0.30]:
    #
    #   sd       0.00    0.06    0.09    0.12    0.15    0.20    0.25    0.30
    #   PIT ks  0.0489  0.0428  0.0325  0.0225  0.0163  0.0302  0.0482  0.0668
    #   tail    0.274   0.259   0.246   0.219   0.206   0.181   0.152   0.124
    #
    # An interior minimum with both edges worse. The criterion is the PIT, declared before the
    # grid was read, because it reads the whole predictive distribution: Brier over the same grid
    # runs 0.04909 to 0.04926, a range of 0.00017 against a bootstrap interval half-width of about
    # 0.001, so it cannot resolve this and choosing on it would be choosing on noise. A calibrated
    # forecast puts 0.20 of its PIT mass in the outer tenths; the point estimate puts 0.274 there,
    # which is the over-narrow season simulation the research report warns about, measured.
    #
    # 0.15 against the attenuated 0.083 measured from the fits is a factor of 1.8 in the expected
    # direction, which is the only cross-check available on the level.
    attack_sd: 0.15
    defence_sd: 0.15

    # Correlation between a club's attack and defence movement. Measured, not chosen: +0.014 over
    # the same 7,458 pairs, which is zero. A club that gets better does not reliably get better at
    # both ends.
    correlation: 0.0

    # sd(horizon) = sd * horizon ** exponent. One half is the random walk, and it is also what the
    # corpus shows: regressing log sd on log horizon over the tuning span gives 0.469 for attack
    # and 0.531 for defence. The measurement landing on the causal value is why this is 0.5 rather
    # than either fitted number -- a walk is the mechanism, and 0.469 is that walk plus noise.
    horizon_exponent: 0.5

  # Points deducted by the competition, which results cannot show and this corpus does not record.
  # Applied to the ACTUAL table only, never to a forecast: a deduction is a disciplinary fact the
  # model has no way to know, and scoring against a table that ignored one would credit the model
  # for a relegation the football did not cause.
  #
  # Recorded from the public record, not derivable from anything here, so treat the figures as
  # citations rather than measurements. Their reach is small and reported: of the four, only
  # Middlesbrough's changes any question's outcome (it relegated them in place of Coventry), and
  # 1996-97 lies in the tuning span, so no result on either evaluation span depends on any of them.
  points_deductions:
    "1996-97": {Middlesbrough: 3}        # failure to fulfil a fixture
    "2009-10": {Portsmouth: 9}           # administration
    "2023-24": {Everton: 8, "Nott'm Forest": 4}   # profitability and sustainability rules
