# Source spelling -> canonical name (an entry in team_roster.yaml).
#
# Only names that differ from their canonical form belong here. A name absent from this file must
# already be on the roster, or ingest raises.
#
# Currently empty for football-data.co.uk: all 116 spellings across E0-E3 1993/94-2025/26 are
# internally consistent, so each is its own canonical name (verified 2026-08-17). This file exists
# and is loaded anyway, because the moment a second source arrives it stops being empty:
#
#   Understat and the FPL API use full club names ("Manchester United", "Wolverhampton
#   Wanderers", "Nottingham Forest") where football-data.co.uk uses short ones ("Man United",
#   "Wolves", "Nott'm Forest"). Those mappings are added when those loaders land, NOT guessed now
#   — an unverified alias is worse than a missing one, because it fails silently.
#
# Never add a fuzzy or approximate match. If two spellings might be the same club, verify it and
# write the mapping explicitly; if they are different clubs (Wimbledon / AFC Wimbledon / Milton
