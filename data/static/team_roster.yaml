# The closed set of canonical team names.
#
# Every team name in the corpus must resolve to an entry here (via team_aliases.yaml where the
# source spelling differs). An unrecognised name RAISES — see plmodel/data/teams.py for why the
# roster is closed rather than open.
#
# Curated 2026-08-17 from all 132 cached season files (E0-E3, 1993/94-2025/26): 116 distinct
# spellings, checked for near-duplicates with `find_near_duplicates`. The source is internally
# consistent — no club is spelled two ways — so canonical names are the source's own spellings.
# Cross-source aliases (Understat, FPL) go in team_aliases.yaml when those loaders land.
#
# Three entries look like duplicates and are NOT:
#   Wimbledon           - Wimbledon FC, the original club, to 2003/04
#   Milton Keynes Dons  - the relocated continuation of Wimbledon FC, from 2004/05
#   AFC Wimbledon       - the 2002 phoenix club, a separate entity
# Merging any of these would splice together the histories of different clubs. This is precisely
# the mistake fuzzy matching would make, and the reason it is never used.

